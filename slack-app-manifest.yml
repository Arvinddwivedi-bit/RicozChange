# RicozChange Slack app manifest
# Import at https://api.slack.com/apps → "From an app manifest"
# then put the App Credentials (client id/secret + signing secret) in the
# backend environment, and set the Interactivity Request URL to
# https://<your-host>/api/slack/interactions
display_information:
  name: RicozChange
  description: Explainable IT change management — approve changes right here.
  background_color: "#312E81"
features:
  bot_user:
    display_name: RicozChange
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  redirect_urls:
    - http://127.0.0.1:8600/api/integrations/slack/oauth/callback
    - https://ricozchange-1y64.onrender.com/api/integrations/slack/oauth/callback
  scopes:
    bot:
      - chat:write
      - im:read
      - im:history
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://ricozchange-1y64.onrender.com/api/slack/interactions
    message_menu_options_url: https://ricozchange-1y64.onrender.com/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
