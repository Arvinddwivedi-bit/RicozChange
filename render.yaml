# Render Blueprint — one-click deploy of RicozChange (web + managed Postgres).
# In the Render dashboard: New → Blueprint → pick this repo → Apply.
# Or use the "Deploy to Render" button in the README.

services:
  - type: web
    name: ricozchange
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ricozchange-db
          property: connectionString
      - key: AUTO_SEED
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false  # set to your Render URL, e.g. https://ricozchange-xxxx.onrender.com
      # Slack integration (phase 2) — fill from api.slack.com app credentials:
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      # SLACK_REDIRECT_URI should be https://<your-host>/api/integrations/slack/oauth/callback
      # Clerk sign-in (v0.2) — see README "Real sign-in" for the 10-minute setup:
      # VITE_CLERK_PUBLISHABLE_KEY is a BUILD-TIME var (bakes the sign-in screen into the SPA).
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GATE_BY_DEMO_USER
        value: "0" # flip to "1" (with the Clerk vars below) to require sign-in
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false # your real email -> admin account auto-provisioned on first sign-in
      # Email-to-change (phase 2) — see README "Email-to-change":
      - key: EMAIL_WEBHOOK_KEY
        sync: false # random string; SendGrid posts to /api/integrations/email/inbound?key=<this>
      - key: EMAIL_ALLOWED_DOMAINS
        sync: false # e.g. yourcompany.com; empty = allow all (demo)
      - key: EMAIL_SWEEP_SECONDS
        value: "300" # background sweep every 5 min (prompts, digests, Slack fallbacks)
      - key: LOG_LEVEL
        value: "INFO"

databases:
  # Render free Postgres: 1 GB, expires after 30 days (recreate or upgrade then).
  - name: ricozchange-db
    plan: free
    databaseName: ricozchange
    user: ricozchange
